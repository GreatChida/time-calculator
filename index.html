<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <!-- ホーム画面に追加したときの設定（Safari で普通に開く場合は使われない） -->
    <meta name="apple-mobile-web-app-title" content="おうちアプリ">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <!-- ロゴを白背景の正方形にしたアイコン（透過のままだと iPhone で黒く塗られるため） -->
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <title>時間課金計算</title>
    <style>
        /* --- 配色（通常） --- */
        :root {
            --bg: linear-gradient(135deg, #D4B896 0%, #A0845C 100%);
            --card: #FDF6EE; --panel: #EDE0D0; --section: #F5EBE0;
            --line: #C4A882; --line-soft: #D4B896;
            --text: #000; --accent: #6B4C2A; --countdown: #c0392b;
            --btn-start: #8B6F47; --btn-plus: #A0845C; --btn-minus: #C4956A; --btn-disabled: #ccc;
            --badge: #8B6F47; --field: #fff; --field-disabled: #eee; --field-disabled-text: #999;
            --total: linear-gradient(135deg, #A0845C 0%, #6B4C2A 100%);
            --shadow: rgba(100, 70, 30, 0.2);
        }
        /* --- 配色（深夜：開始時刻が深夜帯のとき body に .midnight を付ける） --- */
        body.midnight {
            --bg: linear-gradient(135deg, #1a1f3a 0%, #0b0e1f 100%);
            --card: #1e2240; --panel: #2a2f55; --section: #252a4d;
            --line: #4a5190; --line-soft: #4a5190;
            --text: #e8e8f5; --accent: #f5d76e; --countdown: #ff8a80;
            --btn-start: #5c5fb0; --btn-plus: #4b5aa8; --btn-minus: #6b5fa8; --btn-disabled: #3d4266;
            --badge: #7a6fd0; --field: #151936; --field-disabled: #33385e; --field-disabled-text: #8a8fb8;
            --total: linear-gradient(135deg, #3b3f8f 0%, #1a1d4a 100%);
            --shadow: rgba(0, 0, 0, 0.5);
            color-scheme: dark; /* 時刻入力などの標準部品も暗色にする */
        }
        /* 深夜はロゴを白黒反転し、黒地を背景になじませる */
        body.midnight #logo { filter: invert(1) hue-rotate(180deg); mix-blend-mode: screen; }

        /* --- 基本リセット & レイアウト --- */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { height: 100%; overflow: hidden; }
        /* iPhone のダブルタップ拡大を無効化 */
        html, body, button, input { touch-action: manipulation; }
        .hidden { display: none !important; }

        /* --- ボタン共通設定 --- */
        button {
            flex: 1; padding: 17px 12px; border: none; border-radius: 8px;
            font-size: 14px; font-weight: bold; cursor: pointer;
            color: white; -webkit-tap-highlight-color: transparent;
        }
        button:active { transform: scale(0.95); opacity: 0.9; }
        button:disabled { background: var(--btn-disabled) !important; cursor: not-allowed; }

        .btn-start { background: var(--btn-start); }
        .btn-plus  { background: var(--btn-plus); }
        .btn-minus { background: var(--btn-minus); }

        /* --- 情報表示エリア --- */
        .info-row { border-radius: 8px; padding: 11px 10px; margin-bottom: 6px; display: flex; justify-content: space-between; align-items: center; }
        .info-label { font-size: 12px; font-weight: bold; }
        .info-amount { font-size: 18px; font-weight: bold; font-family: 'Courier New', monospace; }

        /* --- 入力・バッジ・カウントダウン --- */
        /* PCでも確実に入力できるよう、通常のinput[type="time"]として表示 */
        #startTimeInput { 
            border: 1px solid var(--line); border-radius: 4px; padding: 2px 4px; 
            font-weight: bold; color: var(--text); background: var(--field); 
            font-size: 16px; width: 88px; 
        }
        #startTimeInput:disabled { background: var(--field-disabled); color: var(--field-disabled-text); cursor: not-allowed; }
        .current-time-text { font-size: 16px; font-weight: bold; color: var(--text); }
        .header-label { font-size: 13px; font-weight: bold; color: var(--text); white-space: nowrap; }
        
        .badge { background: var(--badge); color: white; padding: 2px 8px; border-radius: 6px; font-size: 12px; font-weight: bold; white-space: nowrap; }
        .countdown { color: var(--countdown); font-size: 13px; font-weight: bold; margin-left: 6px; white-space: nowrap; }
        
        .error-text { color: #f44336 !important; font-size: 28px !important; }
        .charge-counter { background: var(--field); color: var(--text); border-radius: 6px; padding: 3px 10px; min-width: 50px; text-align: center; font-weight: bold; border: 2px solid var(--line-soft); font-size: 16px; margin: 0 4px; }
        
        .charge-row { display: flex; gap: 8px; margin-bottom: 6px; align-items: center; }
        .free-input { border: 1px solid var(--line); border-radius: 4px; padding: 8px 6px; font-size: 16px; font-weight: bold; width: 90px; color: var(--text); background: var(--field); }
        .free-input:disabled { background: var(--field-disabled); color: var(--field-disabled-text); cursor: not-allowed; }
        .free-note { font-size: 12px; font-weight: bold; color: var(--accent); white-space: nowrap; }

        /* --- アラームのトグルスイッチ --- */
        .switch { position: relative; display: inline-block; width: 36px; height: 20px; margin-left: 6px; vertical-align: middle; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; inset: 0; background: var(--btn-disabled); border-radius: 20px; transition: 0.2s; cursor: pointer; }
        .slider::before { content: ""; position: absolute; width: 16px; height: 16px; left: 2px; top: 2px; background: #fff; border-radius: 50%; transition: 0.2s; }
        .switch input:checked + .slider { background: var(--btn-plus); }
        .switch input:checked + .slider::before { transform: translateX(16px); }
        .switch input:disabled + .slider { opacity: 0.5; cursor: not-allowed; }

        /* --- アラーム鳴動中の全画面表示（タップで停止） --- */
        /* --- 省電力画面（30秒操作なしで表示。有機ELでは黒い部分がほぼ電力を使わない） --- */
        #saver { position: fixed; inset: 0; z-index: 90; background: #000; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; text-align: center; }
        #saver .mono { font-family: 'Courier New', monospace; font-weight: bold; }
        #saverRemain { font-size: 66px; line-height: 1; color: #6a6a6a; }
        .saver-label { font-size: 14px; font-weight: bold; letter-spacing: 2px; color: #4a4a4a; }
        .saver-value { font-size: 40px; line-height: 1.1; color: #4a4a4a; }
        .saver-hint { position: absolute; bottom: 20px; left: 0; right: 0; font-size: 12px; color: #333; }

        #alarmOverlay { position: fixed; inset: 0; z-index: 100; display: flex; align-items: center; justify-content: center; background: rgba(0, 0, 0, 0.6); color: #fff; font-size: 24px; font-weight: bold; text-align: center; }
    </style>
</head>
<body style="font-family: -apple-system, sans-serif; background: var(--bg); display: flex; align-items: center; justify-content: center; padding: 6px;">

    <div style="background: var(--card); border-radius: 15px; padding: 10px; max-width: 400px; width: 100%; box-shadow: 0 10px 40px var(--shadow);">
        
        <!-- [UI] ロゴ（左） & 開始行・経過時間（右） -->
        <div style="display: flex; gap: 6px; align-items: stretch; margin-bottom: 6px;">
            <img id="logo" src="https://baseec-img-mng.akamaized.net/images/user/logo/cd117c13d716cacaef0c58d8117f60a3.png" alt="ロゴ"
                style="display: block; height: 90px; width: auto; object-fit: contain; align-self: center;" onerror="this.style.display='none'">

            <div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px;">
                <!-- [UI] 開始時間 ～ 現在時間 & n回バッジ -->
                <div id="headerArea" style="background: var(--panel); border-radius: 8px; padding: 4px 6px; display: flex; align-items: center; justify-content: space-between; gap: 4px; border: 1px solid var(--line);">
                    <div style="display: flex; align-items: center; gap: 4px; min-width: 0;">
                        <span class="header-label">開始</span>
                        <input type="time" id="startTimeInput" disabled oninput="adjustStartTime()">
                        <span class="header-label">～</span>
                        <span id="currentTimeDisplay" class="current-time-text">00:00:00</span>
                    </div>
                </div>

                <!-- [UI] メインタイマー & 残り時間 -->
                <div style="flex: 1; background: var(--panel); border-radius: 12px; padding: 2px 6px; display: flex; align-items: center; justify-content: center;">
                    <span id="timer" style="font-size: 26px; font-weight: bold; color: var(--accent); font-family: 'Courier New', monospace;">00:00:00</span>
                    <span id="nextLimit" class="countdown">あと 20:00</span>
                    <span id="cycleBadge" class="badge" style="margin-left: 6px;">1回</span>
                </div>
            </div>
        </div>

        <!-- [UI] 操作ボタン -->
        <div style="display: flex; gap: 8px; margin-bottom: 6px;">
            <button class="btn-start" id="startBtn" onclick="startTimer()">開始</button>
        </div>

        <!-- [UI] 手動課金セクション -->
        <div id="manualSection" style="background: var(--section); border-radius: 12px; padding: 6px 10px; margin-bottom: 6px;">
            <div class="charge-row"><button class="btn-plus" disabled onclick="updateManualCharge(660)">🥤 660円 +</button><div id="count660" class="charge-counter">0</div><button class="btn-minus" disabled onclick="updateManualCharge(-660)">660円 -</button></div>
            <div class="charge-row"><button class="btn-plus" disabled onclick="updateManualCharge(880)">🍚 880円 +</button><div id="count880" class="charge-counter">0</div><button class="btn-minus" disabled onclick="updateManualCharge(-880)">880円 -</button></div>
            <div class="charge-row"><button class="btn-plus" disabled onclick="updateManualCharge(2000)">📷 2000円 +</button><div id="count2000" class="charge-counter">0</div><button class="btn-minus" disabled onclick="updateManualCharge(-2000)">2000円 -</button></div>
            <div class="charge-row"><button class="btn-plus" disabled onclick="updateFreeCharge(1)">🆓 金額 +</button><div id="countFree" class="charge-counter" style="min-width: 70px;">¥0</div><button class="btn-minus" disabled onclick="updateFreeCharge(-1)">金額 -</button></div>
            <div style="display: flex; align-items: center; gap: 6px; margin-top: 2px;"><span class="free-note">任意金額(税込):</span><input type="number" id="freeInput" disabled class="free-input" min="0" step="10" inputmode="numeric" autocomplete="off" placeholder="任意の金額"><span class="free-note" style="font-weight: normal;">円</span>
                <!-- [仮] 効果音テスト用ボタン（確認後に削除予定） -->
                <button class="btn-plus" disabled style="flex: none; margin-left: auto; padding: 6px 4px; font-size: 11px; letter-spacing: -0.5px; white-space: nowrap;" onclick="playBeep()">音&nbsp;&nbsp;1</button>
                <button class="btn-minus" disabled style="flex: none; padding: 6px 4px; font-size: 11px; letter-spacing: -0.5px; white-space: nowrap;" onclick="playAlarm()">音&nbsp;&nbsp;2</button>
                <!-- 本番反映の確認用：最後に更新した時刻（HHMM） -->
                <span id="buildTime" class="free-note" style="font-weight: normal;">1149</span>
            </div>
        </div>

        <!-- [UI] 金額表示 -->
        <div class="info-row" style="background: var(--total); color: white;">
            <span class="info-label">合計金額(税込)<span id="midnightMark" class="hidden"> 🌙深夜</span></span>
            <span class="info-amount" id="totalAmount">¥0</span>
        </div>
        <div class="info-row" style="background: var(--panel); border: 2px solid var(--line);">
            <span class="info-label" style="color: var(--accent);">💡 次の時間<label class="switch"><input type="checkbox" id="alarmToggle" disabled onchange="onAlarmToggle()"><span class="slider"></span></label></span>
            <span class="info-amount" id="predictionAmount" style="color: var(--accent);">¥0</span>
        </div>
    </div>

    <!-- [UI] アラーム鳴動中の表示（画面のどこをタップしても停止） -->
    <div id="alarmOverlay" class="hidden" onclick="stopAlarm()">⏰ 次の時間まで3分<br>タップで停止</div>

    <!-- [UI] 省電力画面（タップで元の画面に戻る） -->
    <div id="saver" class="hidden" onclick="hideSaver()">
        <div id="saverRemain" class="mono">00:00</div>
        <div>
            <div class="saver-label">経過</div>
            <div id="saverElapsed" class="mono saver-value">00:00:00</div>
            <div id="saverTotal" class="mono saver-value">¥0</div>
        </div>
        <div class="saver-hint">タップで戻る</div>
    </div>

    <script>
        // iPhone のピンチ拡大を無効化（Safari は user-scalable=no を無視するため）
        document.addEventListener('gesturestart', e => e.preventDefault());
        let timerInterval = null, baseStartTime = null;
        // 手動追加分はすべて「税込金額」として扱う
        let counts = { 660: 0, 880: 0, 2000: 0 };
        let freeTotal = 0;
        let lastFreeAmount = 0; // 入力欄が空のときに再利用する直前のフリー金額
        let currentAutoCharge = 800;
        const BASE_CHARGE = 800, CYCLE_MINS = 20;
        // 開始時刻がこの時間帯なら終了まで深夜料金（22:00〜翌5:00 開始）
        const MIDNIGHT_FROM_HOUR = 22, MIDNIGHT_TO_HOUR = 5;
        // 次の時間の何秒前に知らせるか
        const WARN_BEFORE_SEC = 180;
        let warnedCycle = -1;      // 知らせ済みのサイクル番号（同じサイクルで二度鳴らさない）
        let alarmInterval = null;  // アラーム連続鳴動のタイマー
        // 何秒操作がなければ省電力画面にするか
        const SAVER_IDLE_MS = 30000;
        let lastActivity = Date.now();
        let wakeLock = null;       // 計測中に画面を消さないためのロック

        // 画面を触ったら操作ありとみなす
        ['pointerdown', 'keydown', 'input'].forEach(ev =>
            document.addEventListener(ev, () => { lastActivity = Date.now(); }, true));

        /** HH:MM:SS 形式の文字列生成 */
        function formatTime(date) {
            const h = String(date.getHours()).padStart(2, '0');
            const m = String(date.getMinutes()).padStart(2, '0');
            const s = String(date.getSeconds()).padStart(2, '0');
            return `${h}:${m}:${s}`;
        }

        /** タイマーを開始する */
        function startTimer() {
            if (timerInterval) return;
            const now = new Date();
            
            // 入力欄に初期値をセット（標準のHH:MM形式）
            document.getElementById('startTimeInput').value = 
                now.getHours().toString().padStart(2, '0') + ':' + now.getMinutes().toString().padStart(2, '0');
            
            document.getElementById('startTimeInput').disabled = false;
            baseStartTime = now;
            // iPhone ではタップ操作の中で音を有効化しておく必要がある
            getAudioCtx();
            if (isAlarmOn()) requestWakeLock();
            lastActivity = Date.now();
            timerInterval = setInterval(refreshDisplay, 500);
            document.getElementById('startBtn').disabled = true;
            // 開始後に手動課金の入力を有効化
            document.querySelectorAll('#manualSection button, #manualSection input, #alarmToggle').forEach(el => el.disabled = false);
            refreshDisplay();
        }

        /** 開始時刻調整（入力された瞬間に即時計算） */
        function adjustStartTime() {
            const timeVal = document.getElementById('startTimeInput').value;
            if (!timeVal) return;
            
            const [h, m] = timeVal.split(':').map(Number);
            const now = new Date();
            let newStart = new Date(now.getFullYear(), now.getMonth(), now.getDate(), h, m, 0, 0);
            
            // もし未来の時刻なら前日分とみなす（深夜跨ぎ対応）
            if (newStart > now) {
                newStart.setDate(newStart.getDate() - 1);
            }

            baseStartTime = newStart;
            refreshDisplay();
        }

        /** 画面表示の更新 */
        function refreshDisplay() {
            const now = new Date();
            document.getElementById('currentTimeDisplay').textContent = formatTime(now);

            if (!baseStartTime) return;
            const diffSec = Math.floor((now.getTime() - baseStartTime.getTime()) / 1000);
            const timerEl = document.getElementById('timer');

            // 未来時刻（エラー）
            if (diffSec < 0) {
                timerEl.textContent = "エラー";
                timerEl.classList.add('error-text');
                document.getElementById('nextLimit').textContent = "---";
                document.getElementById('cycleBadge').textContent = "待機中";
                calculateAndDisplay();
                return;
            }

            timerEl.classList.remove('error-text');
            const h = Math.floor(diffSec / 3600), m = Math.floor((diffSec % 3600) / 60), s = diffSec % 60;
            timerEl.textContent = `${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
            
            const elapsedMinsTotal = Math.floor(diffSec / 60);
            const cycles = Math.floor(elapsedMinsTotal / CYCLE_MINS);
            document.getElementById('cycleBadge').textContent = (cycles + 1) + '回';
            currentAutoCharge = BASE_CHARGE + (cycles * 800);
            
            const remainSec = (cycles + 1) * CYCLE_MINS * 60 - diffSec;
            document.getElementById('nextLimit').textContent = `あと ${String(Math.floor(remainSec / 60)).padStart(2, '0')}:${String(remainSec % 60).padStart(2, '0')}`;

            // 省電力画面の表示内容を更新し、一定時間操作がなければ表示する
            document.getElementById('saverRemain').textContent = `${String(Math.floor(remainSec / 60)).padStart(2, '0')}:${String(remainSec % 60).padStart(2, '0')}`;
            document.getElementById('saverElapsed').textContent = timerEl.textContent;
            if (isAlarmOn() && !alarmInterval && Date.now() - lastActivity >= SAVER_IDLE_MS) {
                showSaver();
            }

            // 次の時間の3分前に知らせる（開始時刻の変更で3分以内に飛び込んだ場合は鳴らさない）
            if (remainSec <= WARN_BEFORE_SEC && remainSec > WARN_BEFORE_SEC - 10 && warnedCycle !== cycles) {
                warnedCycle = cycles;
                notifyBeforeNext();
            }
            
            calculateAndDisplay();
        }

        /** 手動課金額増減 */
        function updateManualCharge(value) {
            const absVal = Math.abs(value);
            if (value > 0) counts[absVal]++;
            else if (counts[absVal] > 0) counts[absVal]--;
            document.getElementById(`count${absVal}`).textContent = counts[absVal];
            calculateAndDisplay();
        }

        /** フリー（任意金額）の増減：入力欄の税込金額をその都度加減する */
        function updateFreeCharge(sign) {
            const input = document.getElementById('freeInput');
            // 入力欄が空なら直前に使った金額で増減する
            const value = input.value === '' ? lastFreeAmount : Math.floor(Number(input.value));
            // 0 が入力されたら初期状態（任意の金額・¥0 表示）に戻す
            if (input.value !== '' && value === 0) {
                lastFreeAmount = 0;
                input.value = '';
                document.getElementById('countFree').textContent = '¥0';
                return;
            }
            if (!Number.isFinite(value) || value <= 0) {
                input.focus();
                return;
            }
            lastFreeAmount = value;
            freeTotal = Math.max(0, freeTotal + (sign * value));
            // ボタン間の表示は累計ではなく、入力された金額を表示する
            document.getElementById('countFree').textContent = `¥${lastFreeAmount.toLocaleString()}`;
            input.value = '';
            calculateAndDisplay();
        }

        /** 合計と予測の計算 */
        /* --- 効果音（Web Audio で生成するため音声ファイル不要） --- */
        let audioCtx = null;
        function getAudioCtx() {
            // iPhone はタップ操作の中で初めて音を有効化できる
            if (!audioCtx) {
                // 対応している iOS ではマナーモードでも鳴るようにする
                if (navigator.audioSession) navigator.audioSession.type = 'playback';
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') audioCtx.resume();
            return audioCtx;
        }

        /** 指定した音を順番に鳴らす：tones = [{ freq, dur }]、gap は音の間隔（秒） */
        function playTones(tones, type, volume, gap) {
            const ctx = getAudioCtx();
            let t = ctx.currentTime + 0.02;
            tones.forEach(({ freq, dur }) => {
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.type = type;
                osc.frequency.value = freq;
                // 音の出だしと終わりを滑らかにしてプツッというノイズを防ぐ
                gain.gain.setValueAtTime(0, t);
                gain.gain.linearRampToValueAtTime(volume, t + 0.005);
                gain.gain.setValueAtTime(volume, t + dur - 0.01);
                gain.gain.linearRampToValueAtTime(0, t + dur);
                osc.connect(gain).connect(ctx.destination);
                osc.start(t);
                osc.stop(t + dur);
                t += dur + gap;
            });
        }

        /** 短い「ピッピ」 */
        function playBeep() {
            playTones([{ freq: 1500, dur: 0.08 }, { freq: 1500, dur: 0.08 }], 'sine', 0.5, 0.08);
        }

        /** アラーム風の「ピピピピッ」 */
        function playAlarm() {
            playTones([
                { freq: 2000, dur: 0.07 }, { freq: 2000, dur: 0.07 },
                { freq: 2000, dur: 0.07 }, { freq: 2000, dur: 0.15 },
            ], 'square', 0.2, 0.05);
        }

        /** 3分前の通知：常に「ピッピ」、トグルが有効ならその後アラームを鳴らし続ける */
        function notifyBeforeNext() {
            hideSaver();
            playBeep();
            if (isAlarmOn()) {
                setTimeout(startAlarm, 500);
            }
        }

        /** アラームを画面タップまで繰り返し鳴らす */
        function startAlarm() {
            if (alarmInterval) return;
            document.getElementById('alarmOverlay').classList.remove('hidden');
            playAlarm();
            alarmInterval = setInterval(playAlarm, 1000);
        }

        /** 省電力画面を表示し、Safari の上下のバーも黒くする */
        function showSaver() {
            document.getElementById('saver').classList.remove('hidden');
            setBarColor('#000000');
        }

        /** 省電力画面を閉じて元の画面に戻す */
        function hideSaver() {
            lastActivity = Date.now();
            document.getElementById('saver').classList.add('hidden');
            setBarColor(null);
        }

        /** ブラウザのバーの色を指定する（null で指定をやめ、通常時の見た目に戻す） */
        function setBarColor(color) {
            let meta = document.querySelector('meta[name="theme-color"]');
            if (!color) { if (meta) meta.remove(); return; }
            if (!meta) {
                meta = document.createElement('meta');
                meta.name = 'theme-color';
                document.head.appendChild(meta);
            }
            meta.content = color;
        }

        /** 計測中は画面が自動で消えないようにする（iOS 16.4 以降の Safari など対応ブラウザのみ） */
        async function requestWakeLock() {
            try {
                if ('wakeLock' in navigator) wakeLock = await navigator.wakeLock.request('screen');
            } catch (e) { /* 低電力モードなどで拒否された場合は何もしない */ }
        }
        // 別のアプリから戻ったときはロックが解除されているので取り直す
        document.addEventListener('visibilitychange', () => {
            if (document.visibilityState === 'visible' && timerInterval && isAlarmOn()) requestWakeLock();
        });

        /** 次の時間のアラーム（トグル）が有効か */
        function isAlarmOn() {
            return document.getElementById('alarmToggle').checked;
        }

        /** トグル切り替え：有効な間だけ画面を消さず、省電力画面を使う */
        function onAlarmToggle() {
            if (isAlarmOn()) {
                requestWakeLock();
            } else {
                if (wakeLock) { wakeLock.release().catch(() => {}); wakeLock = null; }
                hideSaver();
            }
        }

        /** アラームを止める */
        function stopAlarm() {
            clearInterval(alarmInterval);
            alarmInterval = null;
            document.getElementById('alarmOverlay').classList.add('hidden');
        }

        /** 開始時刻が深夜帯かどうか（開始前は通常扱い） */
        function isMidnightStart() {
            if (!baseStartTime) return false;
            const h = baseStartTime.getHours();
            return h >= MIDNIGHT_FROM_HOUR || h < MIDNIGHT_TO_HOUR;
        }

        function calculateAndDisplay() {
            // ボタンの金額は税込なので、時間課金（税抜）に消費税を掛けてから加算する
            const manualTotal = (counts[660] * 660) + (counts[880] * 880) + (counts[2000] * 2000) + freeTotal;
            
            const totalNormal = Math.floor(currentAutoCharge * 1.1) + manualTotal;
            const totalMidnight = Math.floor(totalNormal * 1.1);
            const predNormal = Math.floor((currentAutoCharge + 800) * 1.1) + manualTotal;
            const predMidnight = Math.floor(predNormal * 1.1);

            // 開始時刻で通常／深夜を自動切り替えし、該当する金額だけを表示する
            const midnight = isMidnightStart();
            document.body.classList.toggle('midnight', midnight);
            document.getElementById('midnightMark').classList.toggle('hidden', !midnight);
            const total = midnight ? totalMidnight : totalNormal;
            const pred = midnight ? predMidnight : predNormal;
            document.getElementById('totalAmount').textContent = `¥${total.toLocaleString()}`;
            document.getElementById('predictionAmount').textContent = `¥${pred.toLocaleString()}`;
            document.getElementById('saverTotal').textContent = `¥${total.toLocaleString()}`;
        }

        calculateAndDisplay();
    </script>
</body>
</html>
